name: Fetch Opening Hours

on:
  schedule:
    - cron: '0 6 * * 0'  # Once a week, Sunday 6am UTC (clear of the twice-daily occupancy fetch at 3am/10am UTC)
  workflow_dispatch:      # Allow manual runs from the GitHub Actions tab

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run opening hours scraper
        run: python scripts/fetch_opening_hours.py

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Upload opening hours data to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 r2 object put poliaule-data/opening-hours.json --file data/opening-hours.json --content-type application/json --remote
          npx --yes wrangler@4 r2 object put poliaule-data-beta/opening-hours.json --file data/opening-hours.json --content-type application/json --remote
