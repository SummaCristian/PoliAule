name: Fetch Opening Hours

on:
  schedule:
    - cron: '0 6 * * 0'  # Once a week, Sunday 6am UTC (clear of the twice-daily occupancy fetch at 3am/10am UTC)
  workflow_dispatch:      # Allow manual runs from the GitHub Actions tab

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run opening hours scraper
        run: python scripts/fetch_opening_hours.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/opening-hours.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update opening hours data $(date -u '+%Y-%m-%d')"
          git push
