<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PoliAule</title>
  <meta name="description" content="A website to find available classrooms around Politecnico di Milano" />

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <meta name="theme-color" content="#ECECEC" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1E1E1E" media="(prefers-color-scheme: dark)">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/favicons/main/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicons/main/favicon.svg" />
  <link rel="shortcut icon" href="/favicons/main/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicons/main/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="PoliAule" />
  <link rel="manifest" href="/favicons/main/site.webmanifest" />

  <!-- Preload the logo to improve loading times; fetchpriority=high since it's
       the splash screen's LCP element -->
  <link rel="preload" as="image" href="/favicons/main/logo.webp" fetchpriority="high">

  <!-- Critical CSS: everything the splash screen needs to paint, inlined so
       first paint doesn't wait on the app's full stylesheet (which Vite
       bundles into one ~170KB/27KB-gzip file and, on a throttled connection,
       can take seconds to arrive). The full stylesheet below is loaded
       non-blocking (see the media="print" swap trick) and takes over once it
       lands. All the ".splash-*" rules are intentionally NOT duplicated
       there (see style.css's "Splash Screen" comment) — this is their only
       copy. ".noscript-overlay" IS duplicated there on purpose (that one
       isn't transient); keep the two in sync if it changes. -->
  <style>
    :root {
      box-sizing: border-box;
      --background-color: #F2F2F2;
      --text-color-primary: #1A1A1A;
      --text-color-secondary: #333333;
      --text-75: 0.75rem;
      --text-90: 0.9rem;
      --text-110: 1.1rem;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background-color: #1E1E1E;
        --text-color-primary: #EAEAEA;
        --text-color-secondary: #CCCCCC;
      }
    }

    *, *:before, *:after {
      box-sizing: inherit;
    }

    html {
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      background-color: transparent;
    }

    html:has(.splash-overlay) {
      overflow: hidden;
    }

    body {
      min-height: 100%;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      background-color: var(--background-color);
      text-align: center;
      font-family: "Nunito", -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .noscript-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--background-color);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .splash-overlay {
      position: fixed;
      inset: 0;
      z-index: 9998;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .splash-overlay::before {
      content: '';
      position: absolute;
      inset: 0;
      background-color: var(--background-color);
      transition: opacity 0.65s ease-out;
      pointer-events: none;
    }

    .splash-overlay.splash-hiding::before {
      opacity: 0;
    }

    .splash-logo {
      width: auto;
      height: 10rem;
      user-select: none;
      -webkit-user-drag: none;
      will-change: transform;
      opacity: 0.5;
      scale: 0.75;
      animation: splash-logo-fade-in 0.5s ease-out 0.1s forwards;
    }

    @keyframes splash-logo-fade-in {
      to {
        opacity: 1;
        scale: 1;
      }
    }

    .splash-logo.splash-logo-flying {
      transition: transform 1s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .splash-header-item {
      opacity: 0;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .splash-header-item.splash-revealed {
      opacity: 1;
    }

    .splash-loading-label {
      position: absolute;
      bottom: 3.5rem;
      font-size: var(--text-75);
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-color-secondary);
      opacity: 0;
      scale: 0.88;
      animation: splash-loading-appear 1s ease-out 3s forwards;
    }

    .splash-loading-label::after {
      content: '...';
      display: inline-block;
      overflow: hidden;
      vertical-align: bottom;
      width: 0;
      animation: splash-loading-dots 1.4s steps(4, end) 3s infinite;
    }

    @keyframes splash-loading-appear {
      to {
        opacity: 0.5;
        scale: 1;
      }
    }

    @keyframes splash-loading-dots {
      to { width: 1.1em; }
    }

    @media (prefers-reduced-motion: reduce) {
      .splash-logo {
        animation: none;
        opacity: 1;
      }

      .splash-logo.splash-logo-flying {
        transition: transform 0s;
      }

      .splash-loading-label,
      .splash-loading-label::after {
        animation: none;
      }
    }

    .splash-overlay.splash-error {
      flex-direction: column;
      gap: 0.5rem;
      padding: 2rem;
      text-align: center;
    }

    .splash-error-icon {
      font-size: 2.5rem;
      color: var(--text-color-secondary);
      margin-bottom: 0.25rem;
      opacity: 0;
      animation: splash-logo-fade-in 0.4s ease-out 0.1s forwards;
    }

    .splash-error-title {
      font-size: var(--text-110);
      font-weight: 700;
      color: var(--text-color-primary);
      opacity: 0;
      animation: splash-logo-fade-in 0.4s ease-out 0.15s forwards;
    }

    .splash-error-subtitle {
      font-size: var(--text-90);
      color: var(--text-color-secondary);
      margin-bottom: 1rem;
      opacity: 0;
      animation: splash-logo-fade-in 0.4s ease-out 0.2s forwards;
    }

    .splash-error-reload {
      opacity: 0;
      animation: splash-logo-fade-in 0.4s ease-out 0.25s forwards;
    }

    /* Keep the real UI entirely out of the layout tree (not just hidden —
       display:none, so it has no rendered box at all) until every "shell"
       stylesheet below has resolved. An element that never had a previous
       box doesn't register as a Cumulative Layout Shift when it first
       appears; letting it paint unstyled and then reflow once CSS attaches
       does (this replaced a single reflow that scored 0.88 on its own —
       the whole .body-container snapping from an unstyled box into its
       real flex layout). See window.__onShellCssLoad below. */
    :root:not(.css-ready) body > *:not(#splash-overlay) {
      display: none;
    }
  </style>

  <!-- Without JS, window.__onShellCssLoad below never runs, so .css-ready
       never gets added — the rule above would hide the app forever. The
       synchronous <noscript><link> fallbacks (below, one per deferred
       stylesheet) already load everything render-blocking in that case, so
       just force the real content back on and drop the (now permanently
       stuck) splash. -->
  <noscript>
    <style>
      body > * { display: revert !important; }
      #splash-overlay { display: none !important; }
    </style>
  </noscript>

  <script>
    // Shared by every "shell" stylesheet link below (the ones that define
    // the app's actual box layout — style.css and the per-component CSS
    // files, or their single bundled equivalent in production). Each one
    // is marked data-shell-css and loaded non-blocking (media="print" swap
    // trick); this re-checks, on every load/error, whether any are still
    // pending, and flips the switch above once none are. Deliberately
    // excludes the Google Fonts / Hugeicons stylesheets further down —
    // gating on those too (slow, cross-origin, sometimes blocked) would
    // reintroduce the render-blocking problem this async-loading trick was
    // meant to fix; their own swap-in cost is comparatively small.
    window.__onShellCssLoad = function (link) {
      link.media = 'all';
      if (!document.querySelector('link[data-shell-css][media="print"]')) {
        document.documentElement.classList.add('css-ready');
      }
    };
  </script>

  <!-- Preconnect to the render-blocking cross-origin CSS below (Google
       Fonts), so DNS/TCP/TLS isn't paid serially after the stylesheet is
       discovered. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Preconnect to the occupancy/opening-hours/config API, so the first
       fetch() call (issued once the JS bundle has downloaded and run,
       config.js/available-rooms-script.js) doesn't pay DNS/TCP/TLS on top of
       that fetch's own round trip. Points at the stable API by default —
       correct for poliaule.com, where getApiBase() (config.js) always
       resolves here; scripts/build-beta.sh swaps this to api-beta before the
       beta build runs, matching that build's default backend. -->
  <link rel="preconnect" href="https://api.poliaule.com" crossorigin>

  <!-- CSS. Plain/blocking here on purpose, even though prod defers the
       equivalent bundled tag (vite.config.js's deferMainStylesheet plugin):
       adding media/onload attributes directly to these 19 source tags makes
       Vite stop merging them into one bundle and ship each as its own file
       instead (tried it — do not repeat). Since these stay render-blocking
       in `npm run dev`, CSS is always already applied before any script
       runs there, so dev never hits the reflow this is working around —
       see vite.config.js's markShellCssReadyInDev plugin. -->
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="./components/date-picker.css" />
  <link rel="stylesheet" href="./components/chip-pickers.css" />
  <link rel="stylesheet" href="./components/data-fetch-card.css" />
  <link rel="stylesheet" href="./components/time-picker.css" />
  <link rel="stylesheet" href="./components/time-range-slider.css" />
  <link rel="stylesheet" href="./components/classroom-list.css" />
  <link rel="stylesheet" href="./components/building-overview.css" />
  <link rel="stylesheet" href="./components/settings.css" />
  <link rel="stylesheet" href="./components/search-overlay.css" />
  <link rel="stylesheet" href="./components/classroom-detail.css" />
  <link rel="stylesheet" href="./components/info-page.css" />
  <link rel="stylesheet" href="./components/bottom-nav.css" />
  <link rel="stylesheet" href="./components/campus-map.css" />
  <link rel="stylesheet" href="./components/campus-sheet.css" />
  <link rel="stylesheet" href="./components/favourites.css" />
  <link rel="stylesheet" href="./components/keybindings.css" />

  <!-- Nunito font. Loaded non-blocking (media="print" swap trick): the
       splash/body font-family fallback stack already covers the pre-load
       gap, and font-display: swap covers the rest of the app, so nothing
       needs this to be render-blocking. -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"
    media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"></noscript>

  <!-- HugeIcons (stroke-rounded) — the app's icon font, self-hosted (see
       public/fonts/hugeicons/icons.css) for a long, cache-controlled TTL
       instead of use.hugeicons.com's 4h one. 50KB gzipped and unused by the
       splash screen, so it's loaded non-blocking too. -->
  <link rel="stylesheet" href="/fonts/hugeicons/icons.css" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="/fonts/hugeicons/icons.css" /></noscript>

  <!-- JS -->
  <script type="module" src="script.js" defer></script>
  <script type="module" src="available-rooms-script.js" defer></script>
  <script type="module" src="./components/classroom-list.js" defer></script>
  <script type="module" src="./components/building-overview.js" defer></script>
  <script type="module" src="./components/bottom-nav.js" defer></script>

</head>

<body>
  <!-- Splash Screen -->
  <div id="splash-overlay" class="splash-overlay" aria-hidden="true">
    <img src="/favicons/main/logo.webp" class="splash-logo" alt="" draggable="false" fetchpriority="high" />
    <span class="splash-loading-label">Loading</span>
  </div>

  <!-- NoScript Overlay (clients with JS disabled) -->
  <noscript>
    <div class="noscript-overlay">
      <p>PoliAule requires JavaScript to work. Please enable it in your browser settings.</p>
    </div>
  </noscript>

  <!-- Header -->
  <div class="header-top-strip" aria-hidden="true"></div>
  <header class="header">
    <div class="header-top-line-container">
      <div class="header-blur-layers" aria-hidden="true">
        <div class="header-blur-layer"></div>
        <div class="header-blur-layer"></div>
        <div class="header-blur-layer"></div>
        <div class="header-blur-layer"></div>
        <div class="header-fade-overlay"></div>
      </div>

      <div class="header-title-container">
        <button class="header-title-btn" id="info-trigger" aria-label="About PoliAule">
          <img src="/favicons/main/logo.webp" class="header-logo" width="434" height="500">

          <div class="header-title-beta-container splash-header-item">
            <h2 class="header-title">PoliAule</h2>
            <h4 class="secondary" id="env-badge" hidden>Beta</h4>
          </div>
        </button>
      </div>

      <div class="header-buttons-container splash-header-item">

        <!-- Favourite toggle (only shown on the classroom detail page).
             Content is swapped between the hgi-star outline and a filled star
             by classroomDetail._syncFavBtn(). -->
        <button id="favourite-btn" class="header-button liquid-glass" hidden aria-label="Add to favourites">
          <i class="hgi-stroke hgi-star" aria-hidden="true"></i>
        </button>

        <!-- Data Fetch Indicator — the button morphs into a glass card holding
             the freshness status + reload button (see components/data-fetch-card.js). -->
        <button id="data-fetch-btn" class="header-button liquid-glass" aria-label="Data status">
          <div id="data-fetch-indicator" class="pulse-indicator"></div>
        </button>

        <!-- Settings button -->
        <button id="settings-btn" class="header-button liquid-glass" aria-label="Settings">
          <i class="hgi-stroke hgi-settings-01" aria-hidden="true"></i>
        </button>

      </div>


    </div>

    <!-- Reserves the 3.5rem nav-row band in the header layout (see
         .header-nav-row); the back button itself is a sibling of <header>
         below, not a child, so Safari never bakes it into the
         ::view-transition-old(app-header) snapshot (it doesn't subtract
         descendants with their own view-transition-name), which left a
         frozen ghost of the button during the close transition. -->
    <div class="header-nav-row"></div>

  </header>

  <button id="detail-back-btn" class="detail-back-btn liquid-glass" hidden aria-label="Back">
    <i class="hgi-stroke hgi-chevron-left" aria-hidden="true"></i>
  </button>


  <!-- Rest of the UI under the header -->
  <div class="body-container">

    <!-- Available Classrooms -->
    <div id="available-classrooms-container" class="tab-content visible">

      <!-- Favourite Classrooms -->
      <div class="favourites-section">
        <div class="section-header">
          <h3 class="section-header-title"><i class="hgi-stroke hgi-star section-header-title-icon"
              aria-hidden="true"></i><span data-i18n="favourites.title">Favourites</span></h3>
        </div>
        <div id="favourites-carousel" class="favourites-carousel" hidden></div>
        <p id="favourites-empty" class="favourites-empty secondary" data-i18n="favourites.empty">Star a classroom to pin
          it here.</p>
      </div>

      <div class="section-header">
        <h3 class="section-header-title"><i class="hgi-stroke hgi-calendar-03 section-header-title-icon"
            aria-hidden="true"></i><span data-i18n="available.title">Available Classrooms</span></h3>
      </div>

      <form id="available-classrooms-form" class="form" data-loading>

        <!-- Campus + Date pills, side by side (wrap on narrow screens) -->
        <div class="picker-row">
          <!-- Campus Picker -->
          <campus-chip-picker data-loading>
            <input type="hidden" id="campus-picker" name="campus" />
          </campus-chip-picker>

          <!-- Date + Time share a sub-container so that, when they're docked as
               inline panels on desktop, they stack together beside the campus
               list instead of each wrapping to its own full-width row. On mobile
               this wrapper is display:contents (see style.css) so nothing
               changes. -->
          <div class="picker-substack">
            <!-- Date picker — compact glass pill that morphs into a popup holding
                 the sliding picker below (see components/date-chip-picker.js). -->
            <date-chip-picker data-loading>
              <div class="date-picker">
                <select id="date-picker" name="date" hidden></select>

                <div id="today-indicator" class="hidden" aria-hidden="true" data-i18n="datepicker.today">Today</div>
                <div class="date-picker-container"></div>
                <div class="date-indicator"></div>
              </div>
            </date-chip-picker>

            <!-- Time range picker — compact glass pill that morphs into a popup
                 holding the drag-based slider (see components/time-range-chip-picker.js). -->
            <time-range-chip-picker data-loading>
              <div class="time-pickers-container">
                <!-- From time picker -->
                <div class="time-picker">
                  <input type="time" id="from-time-picker" name="from" min="07:15" max="20:15" />
                </div>

                <!-- To time picker -->
                <div class="time-picker">
                  <input type="time" id="to-time-picker" name="to" min="07:15" max="20:15" />
                </div>
              </div>
            </time-range-chip-picker>
          </div>
        </div>
      </form>

      <div id="available-classrooms-results" class="available-classrooms-container empty">
        <i class="hgi-stroke hgi-search-01 empty-container-icon" aria-hidden="true"></i>
        <p class="empty-container-title" data-i18n="results.emptyTitle">Need a classroom?</p>
        <p class="empty-container-subtitle" data-i18n="results.emptySubtitle">Tell me when you need it and I’ll show you
          what’s available</p>
      </div>

    </div>

    <!-- Campus — fullscreen Mapbox map. Filled lazily by components/campus-map.js
         on first activation; campus-map.css turns this panel into a fixed,
         edge-to-edge layer behind the header / footer / nav. -->
    <div id="search-classrooms-container" class="tab-content"></div>

    <!-- Classroom Detail Panel (sibling to tab-content divs, shown in-place) -->
    <div id="classroom-detail-overlay" hidden></div>

    <!-- Info Page Panel (sibling to tab-content divs, shown in-place) -->
    <div id="info-page-overlay" hidden></div>

  </div>

  <footer class="footer">
    <button class="transparent-button version-info-button">
      <label class="secondary" data-i18n="footer.versionInfo"></label>
    </button>
    <div id="version-info-content" hidden>
      <img src="/favicons/main/logo.webp" class="changelog-logo" width="434" height="500" />
      <h1 class="popover-title" data-i18n="footer.versionInfo"></h1>
      <div class="changelog-container">
        <h2 class="popover-subtitle" data-i18n="footer.whatsNew">What's new?</h2>

        <ul>
          <li data-i18n="changelog.item1"></li>
          <li data-i18n="changelog.item2"></li>
          <li data-i18n="changelog.item3"></li>
        </ul>

        <a href="https://github.com/SummaCristian/poliaule" target="_blank" class="hero-badge">
          <svg class="hero-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M12 0.297c-6.627 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.387 
                0.6 0.113 0.82-0.26 0.82-0.577 0-0.285-0.01-1.04-0.015-2.04 
                -3.338 0.724-4.042-1.61-4.042-1.61-0.546-1.387-1.333-1.756-1.333-1.756 
                -1.09-0.745 0.083-0.729 0.083-0.729 1.205 0.084 1.838 1.237 1.838 1.237 
                1.07 1.834 2.807 1.304 3.492 0.997 0.108-0.775 0.418-1.304 0.762-1.604 
                -2.665-0.303-5.467-1.334-5.467-5.932 0-1.31 0.468-2.38 1.236-3.22 
                -0.124-0.303-0.536-1.523 0.117-3.176 0 0 1.008-0.322 3.3 1.23 
                0.957-0.266 1.983-0.399 3.003-0.404 1.02 0.005 2.047 0.138 3.006 0.404 
                2.289-1.552 3.295-1.23 3.295-1.23 0.655 1.653 0.243 2.873 0.12 3.176 
                0.77 0.84 1.235 1.91 1.235 3.22 0 4.61-2.807 5.625-5.48 5.921 
                0.43 0.37 0.823 1.096 0.823 2.21 0 1.595-0.015 2.877-0.015 3.267 
                0 0.32 0.216 0.694 0.825 0.576C20.565 22.092 24 17.592 24 12.297 
                24 5.67 18.627 0.297 12 0.297z" />
          </svg>
          <span class="hero-text" data-i18n="footer.checkOnGitHub">Check on GitHub</span>
        </a>

      </div>
    </div>

    <label class="secondary info-label">
      <strong><span data-i18n="footer.disclaimer5">Not affiliated with Politecnico di Milano.</span></strong>
    </label>
  </footer>

  <!-- Data-fetch status card. data-fetch-card.js relocates this container into a
       morphing card shell that grows from the header button. -->
  <div id="data-fetch-indicator-popover-container" class="data-fetch-popover-container"></div>

  <!-- Search overlay (opened by the bottom-nav search FAB; floats over the current tab) -->
  <div id="search-overlay" class="search-overlay-backdrop" hidden>
    <div class="search-overlay-panel" role="dialog" aria-modal="true" aria-label="Search classrooms">
      <div class="search-overlay-header">
        <div class="search-bar-wrapper liquid-glass">
          <i class="hgi-stroke hgi-search-01" aria-hidden="true"></i>
          <input type="text" id="classroom-search-input" class="search-input"
            data-i18n-attr="placeholder:search.inputPlaceholder" placeholder="e.g. 2.0.1, Trifoglio..."
            autocomplete="off" spellcheck="false" />
          <button id="classroom-search-clear" class="search-clear-btn" type="button" tabindex="-1"
            aria-label="Clear search">
            <i class="hgi-stroke hgi-cancel-01" aria-hidden="true"></i>
          </button>
        </div>
        <button id="search-overlay-close" class="search-overlay-close liquid-glass" type="button"
          aria-label="Close search">
          <i class="hgi-stroke hgi-cancel-01" aria-hidden="true"></i>
        </button>
      </div>
      <div id="search-overlay-results" class="search-overlay-results"></div>
    </div>
  </div>

  <!-- Bottom pill nav / side rail: Vitrium's tab bar, built by components/bottom-nav.js -->
  <div class="bn-wrapper" id="bn-wrapper"></div>

</body>

</html>
